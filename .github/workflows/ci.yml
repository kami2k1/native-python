name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM/LLD dev libraries (embedded backend)
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev liblld-18-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # windows-latest ships MSVC (Visual Studio) and LLVM clang++ in PATH.
      - name: Configure (MSVC)
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        shell: bash
